name: shell-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x install.sh update.sh uninstall.sh tgctl
